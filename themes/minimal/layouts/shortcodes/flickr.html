<span class="img">
  <a data-flickr-embed="true" href="https://www.flickr.com/photos/{{ .Get "href" }}" title="{{ .Get "title" }}">
    <img src="https://live.staticflickr.com/{{ .Get "thumbnail" }}"
      width="{{ .Get "width" }}" height="{{ .Get "height" }}"
      alt="{{ .Get "title" | default "Flickrの画像" }}" loading="lazy" decoding="async">
  </a>
  {{ with .Get "title" }}<span class="img-caption">{{ . }}</span>{{ end }}
  <script async src="//embedr.flickr.com/assets/client-code.js" charset="utf-8"></script>
</span>
