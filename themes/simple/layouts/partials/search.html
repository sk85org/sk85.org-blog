{{ if .Site.Params.enable_search }}
{{ $searchURL := .Site.Params.searchserver_url | default ("search/" | relURL) }}
<form class="site-search" method="get" action="{{ $searchURL }}" role="search">
  <label class="visually-hidden" for="site-search-input">サイト内検索</label>
  <input id="site-search-input" type="search" name="q" value="" placeholder="検索" enterkeyhint="search" />
  <input type="hidden" name="enc" value="UTF-8" />
</form>
{{ end }}
