<footer class="site-footer">
  <p>
    {{ with .Site.Copyright }}{{ . | safeHTML }}{{ else }}© {{ now.Format "2006" }} {{ .Site.Title }}{{ end }}
    {{ with .OutputFormats.Get "rss" }} · <a href="{{ .RelPermalink }}">RSS</a>{{ end }}
    {{ if .Site.Params.enable_search }} · <a href="{{ .Site.Params.searchserver_url | default ("search/" | relURL) }}">検索</a>{{ end }}
  </p>
</footer>
