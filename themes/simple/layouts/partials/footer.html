<footer class="site-footer">
  <p>
    {{ with .Site.Copyright }}{{ . | safeHTML }}{{ else }}© {{ now.Format "2006" }} {{ .Site.Title }}{{ end }}
    {{- $rss := .OutputFormats.Get "rss" }}
    {{- if not $rss }}{{ $rss = .Site.Home.OutputFormats.Get "rss" }}{{ end }}
    {{- with $rss }} · <a href="{{ .RelPermalink }}">RSS</a>{{ end }}
  </p>
</footer>
