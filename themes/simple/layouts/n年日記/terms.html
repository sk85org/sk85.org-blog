{{ define "main" }}
<div class="post-head">
  <h1 class="post-title">{{ .Title | lower }}</h1>
  <div class="post-head-search">
    {{ partial "search-compact.html" . }}
  </div>
</div>
<ul class="tag-list">
  {{- $plural := .Data.Plural }}
  {{- range .Data.Terms.Alphabetical.Reverse }}
    <li><a href="{{ printf "%s/%s/" $plural (.Name | urlize) | relLangURL }}">{{ .Name }}</a> <span>{{ .Count }}</span></li>
  {{- end }}
</ul>
{{ end }}
